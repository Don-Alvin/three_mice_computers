name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json.
      # Do not also pass a `version:` input here — action-setup errors on both.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # `next lint` was removed in Next.js 16 — ESLint is invoked directly.
      - name: Lint
        run: pnpm exec eslint .

# Phase 2: add a `test` job here (unit tests for payment/order logic)
# and make it a required check alongside this one. Do not add a test
# suite in Phase 1 — there is no money-moving logic to protect yet.
